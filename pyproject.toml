[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrbench"
version = "0.1.0"
description = "AMRBench pilot: benchmark scaffold and evaluation harness for genome-based AMR prediction"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
gnn = ["torch"]
dev = ["pytest"]

[project.scripts]
amrbench = "amrbench.cli:main"

[tool.setuptools.packages.find]
include = ["amrbench*"]
